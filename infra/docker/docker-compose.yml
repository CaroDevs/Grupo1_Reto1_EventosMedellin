services:
  postgres:
    # postgis/postgis en vez de postgres:16-alpine: mismo Postgres 16, pero
    # con la extensión PostGIS ya instalada (la necesitamos para guardar la
    # ubicación de las actividades y mostrarlas en el mapa).
    image: postgis/postgis:16-3.4
    container_name: medellin-activities-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medellin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medellin}
      POSTGRES_DB: ${POSTGRES_DB:-medellin_activities}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
