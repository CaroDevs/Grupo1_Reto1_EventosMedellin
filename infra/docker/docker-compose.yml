services:
  postgres:
    image: postgres:16-alpine
    container_name: medellin-activities-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medellin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medellin}
      POSTGRES_DB: ${POSTGRES_DB:-medellin_activities}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
